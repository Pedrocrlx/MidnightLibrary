services:
  database:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: ops/Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    volumes:
      - static_data:/app/django-app/staticfiles
    networks:
      - backend
    depends_on:
      database:
        condition: service_healthy
    command: >-
      sh -c "python django-app/manage.py migrate --noinput &&
      python django-app/manage.py collectstatic --noinput &&
      uvicorn --app-dir django-app --host 0.0.0.0 --port 8000
      --workers 3 LMS.asgi:application"

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ops/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ops/nginx/cloudflare-realip.conf:/etc/nginx/conf.d/cloudflare-realip.conf:ro
      - ./secrets/cloudflare-origin-certificate.pem:/etc/nginx/certs/origin.pem:ro
      - ./secrets/cloudflare-origin-certificate.key:/etc/nginx/certs/origin.key:ro
      - static_data:/var/www/static:ro
    networks:
      - backend
    depends_on:
      - app

networks:
  backend:
    driver: bridge

volumes:
  db_data:
  static_data:
