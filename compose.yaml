services:
  database:
    image: postgres:17
    restart: always
    volumes:
      - db_data:/var/lib/postgresql/data
    env_file:
      - .env
    networks:
      - database_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: .
      dockerfile: ops/Dockerfile
      target: development
    ports:
      - 8000:8000
    command: python django-app/manage.py runserver 0.0.0.0:8000
    volumes:
      - ./:/app/
      - /app/.venv
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    networks:
      - database_network

  adminer:
    image: adminer
    restart: always
    networks:
      - database_network
    depends_on:
      - database
    
networks:
  database_network:
    driver: bridge

volumes:
  db_data:
        
